name: Release

# Publishes to PyPI when a version tag (vX.Y.Z) is pushed.
# One-time setup: on pypi.org add a "trusted publisher" for this repository
# (workflow: release.yml, environment: pypi). No API token is stored here.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('git_context_dump/__init__.py').read()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ ${version}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
