[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-context-dump"
dynamic = ["version"]
description = "Create compact Markdown snapshots of Git working directories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "imardagokce" }]
keywords = ["llm", "context", "git", "markdown", "cli"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/imardagokce/git-context-dump"
Repository = "https://github.com/imardagokce/git-context-dump"
Issues = "https://github.com/imardagokce/git-context-dump/issues"
Changelog = "https://github.com/imardagokce/git-context-dump/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
dev = ["ruff>=0.6", "mypy>=1.11", "coverage[toml]>=7"]

[project.scripts]
git-context-dump = "git_context_dump.cli:main"

[tool.setuptools.packages.find]
include = ["git_context_dump*"]

[tool.setuptools.package-data]
git_context_dump = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "git_context_dump.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The tree renderer intentionally uses box-drawing characters (├ └ │).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["git_context_dump"]

[[tool.mypy.overrides]]
module = ["tiktoken", "tiktoken.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["git_context_dump"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
